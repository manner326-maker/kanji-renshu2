<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かんじれんしゅう2">
<meta name="theme-color" content="#FFFBF0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>かんじれんしゅう2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 白〜淡いクリームの地に、水色・黄色・ミント・ピンク。主役は問題の文字と書き取り欄。横向きは「問題｜筆記」の2列。 */
  --bg:#FFFBF0; --surface:#FFFFFF; --ink:#283044; --muted:#5F6879; --line:#ECE4CF;
  --sky:#4FB6E8; --sky-soft:#DDF1FB; --sun:#FFCF3F; --sun-soft:#FFF3C7;
  --mint:#5CCB9F; --mint-soft:#DCF6EA; --pink:#FF7EA6; --pink-soft:#FFE3EC;
  --font-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-kanji:"Klee One","YuKyokasho","UD Digi Kyokasho N-R","Hiragino Mincho ProN",serif;
  --r-l:28px; --r-m:20px; --r-s:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-weight:500;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
#app.scroll{overflow:auto;display:block}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:900}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.noselect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---- buttons ---- */
.btn{border:3px solid transparent;border-radius:999px;padding:0 26px;min-height:56px;font-size:20px;font-weight:700;
  background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 0 rgba(40,48,68,.12);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(40,48,68,.12)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--sun);border-color:#E8B726}
.btn.xl{min-height:72px;font-size:28px;padding:0 48px;min-width:220px}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line);min-height:48px;font-size:17px}
.btn.danger{background:var(--pink-soft);border-color:var(--pink)}
.btn.small{min-height:44px;font-size:16px;padding:0 18px}

/* option chips (pressed state shown by border + check, not color alone) */
.opt{border:3px solid var(--line);background:var(--surface);border-radius:var(--r-m);min-height:56px;
  padding:8px 18px;font-size:19px;font-weight:700;text-align:left;display:flex;align-items:center;gap:10px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sky-soft)}
.opt[aria-pressed="true"]::before{content:"✓";font-weight:900}
.opt .sub{display:block;font-size:14px;color:var(--muted);font-weight:500}

/* ---- top bars ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:3px dashed var(--line)}
.brand{font-family:var(--font-kanji);font-weight:600;font-size:30px;display:flex;align-items:center;gap:12px}
.brand i{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--pink);color:#fff;font-style:normal;font-size:28px;transform:rotate(-6deg)}

/* ---- home ---- */
.home{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:20px;padding:20px 24px;min-height:0;overflow:auto}
.panel{background:var(--surface);border-radius:var(--r-l);padding:20px;border:3px solid var(--line);display:flex;flex-direction:column;gap:14px;min-height:0}
.panel h2{font-size:20px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--h, var(--sky))}
.setlist{display:flex;flex-direction:column;gap:10px;overflow:auto}
.setlist .opt{flex-direction:column;align-items:flex-start;gap:2px}
.setlist .opt[aria-pressed="true"]::before{display:none}
.setlist .opt[aria-pressed="true"]{background:var(--sun-soft)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .opt{min-height:76px}
.modes .opt[data-mode="5"]{grid-column:1/-1;background:linear-gradient(90deg,var(--sky-soft),var(--sun-soft),var(--mint-soft),var(--pink-soft))}
.modes .opt[data-mode="5"][aria-pressed="true"]{border-color:var(--ink)}
.modes .num{font-family:var(--font-kanji);font-size:30px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .lab{font-size:15px;color:var(--muted);min-width:5.5em}
.startbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700;background:var(--mint-soft)}
.pill.warn{background:var(--pink-soft)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--mint-soft);border-radius:var(--r-m);padding:12px 16px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:16px;line-height:1.7}

/* ---- quiz ---- */
.qbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:12px 20px 8px}
.qinfo{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.count{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.chip{background:var(--sky-soft);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.chip.rev{background:var(--pink-soft)}
.pbar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--mint);border-radius:999px}
.qmain{display:grid;grid-template-columns:minmax(280px,36%) 1fr;gap:18px;padding:10px 20px;min-height:0}
.qmain.left-hand{grid-template-columns:1fr minmax(280px,36%)}
.qmain.left-hand .prompt{order:2}
.qmain.single{grid-template-columns:1fr 1.2fr}
.prompt{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.label{font-size:17px;color:var(--muted);font-weight:700}
.ptext{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--font-kanji);font-weight:600;word-break:break-word;line-height:1.25}
.prompt,.truth{container-type:inline-size}
.fitlen{font-size:min(var(--max),calc(88cqi / var(--len,1)))}
.ptext.kanji{--max:150px}
.ptext.yomi{--max:84px}
.ptext.imi{font-size:clamp(24px,2.8vw,36px);line-height:1.6;text-align:left;place-items:center start}
.work{display:flex;flex-direction:column;gap:10px;min-height:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .opt{min-height:52px;font-size:17px;padding:6px 16px}
.padwrap{flex:1;min-height:0;display:grid;place-items:center}
canvas.pad{background:var(--surface);border:3px solid var(--sky);border-radius:var(--r-m);touch-action:none;display:block}
canvas.pad.erasing{border-color:var(--pink)}
.think{flex:1;display:grid;place-items:center;background:var(--sun-soft);border-radius:var(--r-l);padding:28px;text-align:center;font-size:24px;line-height:1.8;font-weight:700}
.think small{display:block;font-size:17px;color:var(--muted);font-weight:500}
.qfoot,.afoot{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 20px 18px;flex-wrap:wrap}
.afoot{justify-content:space-between}

/* ---- answer ---- */
.amain{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:10px 20px;min-height:0}
.amain.single{grid-template-columns:1fr}
.mine,.truth{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.truth{border-color:var(--mint)}
.big{font-family:var(--font-kanji);font-weight:600;text-align:center;line-height:1.2;word-break:break-word}
.big.kanji{--max:130px}
.big.yomi{--max:76px}
.big.imi{font-size:clamp(22px,2.4vw,30px);line-height:1.6}
.facts{display:grid;gap:8px;margin:0}
.facts div{display:grid;grid-template-columns:4.5em 1fr;gap:10px;align-items:baseline;background:var(--bg);border-radius:var(--r-s);padding:8px 14px}
.facts dt{font-size:15px;color:var(--muted);font-weight:700}
.facts dd{margin:0;font-family:var(--font-kanji);font-size:22px;font-weight:600;line-height:1.5}
.note{font-size:17px;line-height:1.6;background:var(--sky-soft);border-radius:var(--r-s);padding:10px 14px}
.judge{display:flex;flex-direction:column;gap:8px}
.jrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jrow .jl{font-weight:900;font-size:18px;min-width:3em}
.jbtn{min-height:60px;min-width:170px;font-size:22px;border-radius:999px;border:3px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.jbtn .mk{font-size:26px;line-height:1}
.jbtn.ok[aria-pressed="true"]{background:var(--mint-soft);border-color:var(--ink)}
.jbtn.ng[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--ink)}
.jbtn[aria-pressed="true"]::after{content:"← えらんだ";font-size:14px;font-weight:700}
.jbtn[aria-pressed="true"][data-auto="1"]::after{content:"← じどう";}
.recog{border-radius:var(--r-s);padding:10px 14px;font-size:17px;line-height:1.6;background:var(--sky-soft);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.recog.ok{background:var(--mint-soft)} .recog.ng{background:var(--pink-soft)} .recog.err{background:var(--sun-soft)}
.recog .rt{font-family:var(--font-kanji);font-weight:600;font-size:30px;letter-spacing:.06em}
.recog .vd{font-weight:900}
.recog small{flex-basis:100%;color:var(--muted);font-size:15px}
.hint{font-size:16px;font-weight:700;color:var(--muted);align-self:center;margin-left:auto}
.brand .ver{font-family:var(--font-ui);font-size:18px;background:var(--sky);color:#fff;border-radius:999px;padding:2px 10px;margin-left:-4px}
.rlist{display:flex;flex-direction:column;gap:12px}
.ritem{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.ritem.wrong{border-color:var(--pink)}
.rno{font-weight:900;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.rbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.rhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rq .label{font-size:14px}
.rp{font-family:var(--font-kanji);font-weight:600;font-size:22px}
.rk{font-family:var(--font-kanji);font-weight:600;font-size:26px}
.rans{display:flex;flex-direction:column;gap:6px;align-items:center}
canvas.pad.thumb{border-width:2px}
.rrec{font-size:15px}.rrec b{font-family:var(--font-kanji);font-size:22px}
.rjudge{display:flex;flex-direction:column;gap:8px}
.jbtn.sm{min-width:64px;min-height:52px}
.jbtn.sm[aria-pressed="true"]::after{content:""}
@media (max-width:820px){ .ritem{grid-template-columns:auto 1fr} .rans,.rjudge{grid-column:2} }
.credit{font-size:14px;color:var(--muted)}
.amain3{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:14px;padding:8px 20px;min-height:0}
.acol{display:flex;flex-direction:column;gap:12px;min-height:0}
.acol .truth{flex:0 1 auto;padding:14px 16px;gap:8px}
.acol .truth .big.kanji{--max:110px} .acol .truth .big.yomi{--max:60px}
.acol .facts{gap:6px} .acol .facts div{padding:5px 12px} .acol .facts dd{font-size:19px}
.acol .mine{flex:1 1 0;min-height:150px;padding:12px 16px;gap:8px}
.acol .mine .padwrap{min-height:80px}
.acol .recog{padding:8px 12px} .acol .recog .rt{font-size:26px}
.practice{background:var(--surface);border:3px solid var(--sky);border-radius:var(--r-l);padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}
@media (max-aspect-ratio:1/1), (max-width:760px){
  .amain3{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr);overflow:auto}
  .acol{flex-direction:row} .acol .truth,.acol .mine{flex:1 1 0;min-width:0;min-height:0}
  .acol .truth .big.kanji{--max:96px}
}

.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs .opt{min-height:44px;font-size:16px;padding:4px 14px}
.truth .tabs{justify-content:space-between}
.testpad{width:min(100%,560px);height:380px;display:grid;place-items:center}
[data-lp]{touch-action:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .6s}
[data-lp].pressing{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){[data-lp]{transition:none}} .credit a{color:var(--ink)}

/* ---- result ---- */
.result{display:grid;grid-template-columns:minmax(300px,1fr) 1.3fr;gap:20px;padding:20px 24px;min-height:0;overflow:auto}
.scorecard{background:var(--surface);border:3px solid var(--sun);border-radius:var(--r-l);padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;position:relative;overflow:hidden}
.cheer{font-size:28px;font-weight:900}
.score{font-family:var(--font-kanji);font-weight:600;line-height:1}
.score b{font-size:120px;font-variant-numeric:tabular-nums}
.score span{font-size:36px;margin-left:4px}
.frac{font-size:22px;font-weight:700}
.sub2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wlist{display:flex;flex-direction:column;gap:8px;overflow:auto}
.witem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--bg);border-radius:var(--r-s);padding:10px 14px}
.witem .k{font-family:var(--font-kanji);font-weight:600;font-size:30px}
.witem .y{font-size:16px}
.witem .m{font-size:14px;color:var(--muted)}
.tag{font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--pink-soft);white-space:nowrap}
.rfoot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:12px 20px 20px}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.btn{transition:none}}

/* ---- parent ---- */
.parent{max-width:980px;margin:0 auto;padding:20px 24px 60px;display:flex;flex-direction:column;gap:20px}
.parent .panel{font-size:16px;line-height:1.7}
.parent p{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input[type=text],select{font:inherit;font-size:18px;padding:10px 14px;border-radius:var(--r-s);border:3px solid var(--line);background:var(--surface);min-height:52px}
.check{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px}
.check input{width:26px;height:26px;accent-color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{border-radius:var(--r-s);padding:10px 14px;border-left:8px solid}
.msg.err{background:var(--pink-soft);border-color:var(--pink)}
.msg.warn{background:var(--sun-soft);border-color:var(--sun)}
.msg.info{background:var(--sky-soft);border-color:var(--sky)}
.msg ul{margin:4px 0 0;padding-left:1.3em}
.tablewrap{overflow:auto;max-height:340px;border:2px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:pre-wrap}
th{background:var(--bg);position:sticky;top:0}
td.n{font-variant-numeric:tabular-nums;color:var(--muted);width:4em}
td.k{font-family:var(--font-kanji);font-weight:600;font-size:18px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.hist{font-variant-numeric:tabular-nums}

/* ---- dialog & toast ---- */
.modal{position:fixed;inset:0;background:rgba(40,48,68,.35);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:var(--surface);border-radius:var(--r-l);padding:28px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:20px;font-size:20px;line-height:1.7;font-weight:700}
.modal .acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;font-size:17px;font-weight:700;z-index:60;max-width:90vw;text-align:center}

/* ---- portrait / narrow ---- */
@media (max-aspect-ratio:1/1), (max-width:760px){
  .home,.result{grid-template-columns:1fr}
  .qmain,.qmain.left-hand,.qmain.single{grid-template-columns:1fr;grid-template-rows:minmax(150px,30%) 1fr}
  .qmain.left-hand .prompt{order:0}
  .amain{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .amain.single{grid-template-rows:1fr}
  .truth{justify-content:center}
  .ptext.imi{font-size:clamp(22px,4vw,30px)}
  .modes .opt{min-height:68px}
}
@media (max-width:520px){ .modes{grid-template-columns:1fr} .btn.xl{min-width:0;padding:0 28px} .jbtn{min-width:130px} }
</style>

<script id="core">
/* ===== 純粋ロジック（画面に依存しない）：CSV・出題・採点・復習 ===== */
var Core = (function(){
  var HEADER = ['漢字','読み','意味'];

  function decode(buf, enc){
    var bytes = new Uint8Array(buf);
    var bom = bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF;
    var body = bom ? bytes.subarray(3) : bytes;
    if(enc==='shift_jis') return {text:new TextDecoder('shift_jis').decode(bytes), encoding:'shift_jis', bom:false};
    if(enc==='utf-8') return {text:new TextDecoder('utf-8').decode(body), encoding:'utf-8', bom:bom};
    try{ return {text:new TextDecoder('utf-8',{fatal:true}).decode(body), encoding:'utf-8', bom:bom}; }
    catch(e){
      try{ return {text:new TextDecoder('shift_jis').decode(bytes), encoding:'shift_jis', bom:false, guessed:true}; }
      catch(e2){ return {text:new TextDecoder('utf-8').decode(body), encoding:'utf-8', bom:bom}; }
    }
  }

  /* RFC 4180 準拠：引用符内のカンマ・改行・"" を扱う。各レコードの開始行番号を返す。 */
  function parseCSV(text){
    if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
    var records=[], row=[], field='', inQ=false, quoted=false, line=1, recLine=1, error=null, i=0, n=text.length, c;
    function pushField(){ row.push(field); field=''; quoted=false; }
    while(i<n){
      c = text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
        if(c==='\r'){ if(text[i+1]==='\n') i++; field+='\n'; line++; i++; continue; }
        if(c==='\n'){ field+='\n'; line++; i++; continue; }
        field+=c; i++; continue;
      }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r' || c==='\n'){
        if(c==='\r' && text[i+1]==='\n') i++;
        pushField(); records.push({line:recLine, cells:row}); row=[];
        i++; line++; recLine=line; continue;
      }
      if(c==='"'){
        if(!quoted && field.trim()===''){ inQ=true; quoted=true; field=''; i++; continue; }
        if(!error) error={line:line, message:'引用符（"）の位置が正しくありません'};
        field+=c; i++; continue;
      }
      if(quoted){
        if(c.trim()===''){ i++; continue; }
        if(!error) error={line:line, message:'引用符で囲んだ値のあとに、よけいな文字があります'};
        field+=c; i++; continue;
      }
      field+=c; i++;
    }

      if(r.cells.slice(3).some(function(s){return s!=='';})) extraCols=true;

      } else valid.push({line:r.line, kanji:k, yomi:y, imi:m});

  /* 判定：①②④ {result:'ok'|'ng'}、③ {yomi, imi} */

  }
  /* おうちの人による訂正：その回答（日時 t）の履歴を書き換え、最新の回答なら未克服かどうかも直す */
  function reviseReview(review, setId, qid, mode, t, j){

    h.ok=ok; h.fixed=true; if(mode===3){ h.y=j.yomi==='ok'; h.i=j.imi==='ok'; }

  }
  function openReviewIds(review, set, mode){
    return set.questions.filter(function(q){
      if(mode===5) return openModes(review,set.id,q.id).length>0;
      var e=review[reviewKey(set.id,q.id,mode)]; return e && e.open; })
      .map(function(q){ return q.id; });

      yomiOk:yomiOk, imiOk:imiOk, n3:n3, yomiPct:pctOf(yomiOk,n3), imiPct:pctOf(imiOk,n3), details:details, bySub:bySub, autoN:autoN, autoAgree:autoAgree, fixedN:fixedN,
      wrongIds:session.qids.filter(function(q){ return !details[q].ok; }),

  /* 書き取り欄（1200×900、300角のマス）を1マス1文字として分ける。
     各線は外接矩形の中心があるマスに属する。読む順は左上から右へ、次の行へ。 */
  var PAD_W=1200, PAD_H=800, CELL=400;   /* 3×2マス */
  function segmentCells(strokes, geo){

      var c=Math.min(cols-1,Math.max(0,Math.floor((x0+x1)/2/CELL_))), r=Math.min(rows-1,Math.max(0,Math.floor((y0+y1)/2/CELL_)));

      var ox=(k%cols)*CELL_, oy=Math.floor(k/cols)*CELL_, f=256/CELL_;

      var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; cs.forEach(function(s){ s.forEach(function(p){ x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]); }); });

  }

  function normalizeForCompare(s){ return String(s||'').normalize('NFC').replace(/[\s　]+/g,''); }

  return {HEADER:HEADER, decode:decode, parseCSV:parseCSV, analyze:analyze, shuffle:shuffle, sortBySet:sortBySet,
    isComplete:isComplete, isCorrect:isCorrect, reviewKey:reviewKey, applyReview:applyReview,
    segmentCells:segmentCells, judgeCandidates:judgeCandidates, isHiragana:isHiragana, reviseReview:reviseReview, judgeRecognized:judgeRecognized,
    openReviewIds:openReviewIds, openModes:openModes, assignSub:assignSub, modeOf:modeOf, summarize:summarize, normalizeForCompare:normalizeForCompare};
})();

  var cw=Math.max(80,Math.min(w, h*LW/this.lh)), ch=cw*this.lh/LW, dpr=window.devicePixelRatio||1;
  this.c.style.width=cw+'px'; this.c.style.height=ch+'px';

Pad.prototype.pt=function(e){

  for(var gx=C;gx<LW;gx+=C){ x.beginPath(); x.moveTo(gx,0); x.lineTo(gx,H); x.stroke(); }
  for(var gy=C;gy<H;gy+=C){ x.beginPath(); x.moveTo(0,gy); x.lineTo(LW,gy); x.stroke(); }
  x.strokeStyle='#E3F2FA'; x.lineWidth=2; x.setLineDash([10,12]);
  for(var hx=C/2;hx<LW;hx+=C){ x.beginPath(); x.moveTo(hx,0); x.lineTo(hx,H); x.stroke(); }
  for(var hy=C/2;hy<H;hy+=C){ x.beginPath(); x.moveTo(0,hy); x.lineTo(LW,hy); x.stroke(); }

/* ===== 書き味：線の太さ・ペン先（ふで／えんぴつ）・筆圧の感度 ===== */
var INK_COLOR='#1C2030';
var LINE_W={1:10, 2:15, 3:21};                     /* 3×2マス（1マス400）での太さ。旧4×3は比例して細く */
var LINE_LABEL={1:'細い',2:'ふつう',3:'太い'};
var SENS_K={1:0.5, 2:1, 3:1.7}, SENS_LABEL={1:'にぶい',2:'ふつう',3:'びんかん'};
function inkSettings(){ var s=st.settings; return {style:s.brush, width:s.lineW, sens:s.sens}; }
/* ふで：Apple Pencil は筆圧、それ以外（タッチペン・指）は速さで太さを変える。速く抜いた終わりは細く（はらい） */
function brushWidths(p, base, sens){
  var k=SENS_K[sens]||1, n=p.length, f=[], hasP=false, i;
  for(i=0;i<n;i++) if(p[i].length>3){ hasP=true; break; }
  var speed=function(i){
    if(i<=0) return 0.6;
    var a=p[i-1], b=p[i], d=Math.hypot(b[0]-a[0], b[1]-a[1]), dt=(b[2]!=null&&a[2]!=null)?(b[2]-a[2]):0;
    return dt>0 ? d/dt : 0.6;
  };
  var prev=null;
  for(i=0;i<n;i++){
    var raw = hasP ? 1 + k*((p[i][3]!=null?p[i][3]:0.35) - 0.35)*1.8
                   : 1 + k*(0.7 - Math.min(speed(i), 2.4))*0.4;
    raw=Math.max(hasP?0.3:0.5, Math.min(1.9, raw));
    prev = prev==null ? raw : prev*0.65 + raw*0.35;   /* 急に太さが変わらないようならす */
    f.push(prev);
  }
  if(n>2) f[0]*=0.8;                                   /* 入り */
  var ev=0, m=0; for(i=Math.max(1,n-3);i<n;i++){ ev+=speed(i); m++; } ev=m?ev/m:0;
  if(ev>0.9 && n>4){                                   /* はらい：速く抜いたら先細り */
    var kk=Math.min(7, n-1);
    for(var j=0;j<kk;j++){ f[n-1-j]*= 0.18 + 0.82*(j/kk); }
  }
  return f.map(function(v){ return v*base; });
}
function drawStroke(x, p, base, ink){
  var brush = ink.style==='brush';
  if(p.length===1){ x.beginPath(); x.arc(p[0][0],p[0][1],base*(brush?0.65:0.5),0,Math.PI*2); x.fill(); return; }
  if(!brush){
    x.lineWidth=base; x.beginPath(); x.moveTo(p[0][0],p[0][1]);
    for(var i=1;i<p.length-1;i++){ var mx=(p[i][0]+p[i+1][0])/2, my=(p[i][1]+p[i+1][1])/2; x.quadraticCurveTo(p[i][0],p[i][1],mx,my); }
    x.lineTo(p[p.length-1][0],p[p.length-1][1]); x.stroke(); return;
  }
  /* 線の中心をなめらかな曲線でたどり、太さを補間しながら丸を連ねて塗る（太さの段差が出ない） */
  var w=brushWidths(p, base, ink.sens), sx=p[0][0], sy=p[0][1], sw=w[0];
  x.beginPath();
  var stamp=function(cx,cy,r){ x.moveTo(cx+r,cy); x.arc(cx,cy,r,0,Math.PI*2); };
  for(var k=1;k<p.length;k++){
    var last=k===p.length-1;
    var ex = last ? p[k][0] : (p[k][0]+p[k+1][0])/2, ey = last ? p[k][1] : (p[k][1]+p[k+1][1])/2;
    var ew = last ? w[k] : (w[k]+w[k+1])/2, qx=p[k][0], qy=p[k][1];
    var len=Math.hypot(qx-sx,qy-sy)+Math.hypot(ex-qx,ey-qy), steps=Math.max(1, Math.ceil(len/Math.max(1.2, Math.min(sw,ew)/5)));
    for(var j=(k===1?0:1);j<=steps;j++){
      var t=j/steps, u=1-t;
      stamp(u*u*sx+2*u*t*qx+t*t*ex, u*u*sy+2*u*t*qy+t*t*ey, (sw+(ew-sw)*t)/2);
    }
    sx=ex; sy=ey; sw=ew;
  }
  x.fill();
}

function mountPad(canvas, wrap, opts){
  var pad=new Pad(canvas, opts);
  var ro=new ResizeObserver(function(){ var r=wrap.getBoundingClientRect(); pad.fit(r.width-6, r.height-6); });
  ro.observe(wrap); pad.ro=ro; return pad;
}

/* ===== 画面遷移 ===== */
var view='home', pad=null, minePad=null, busy=false, imp=null, reviewId=null, testPad=null, testStrokes=[], practice=null;
function renderKeep(){ var app=$('#app'), y=app.scrollTop; render(); app.scrollTop=y; }
function go(v){ view=v; render(); }
function render(){
  if(pad && pad.ro){ pad.ro.disconnect(); } pad=null;
  if(testPad && testPad.ro){ testPad.ro.disconnect(); } testPad=null;
  if(minePad && minePad.ro){ minePad.ro.disconnect(); } minePad=null;
  var app=$('#app'); app.className = (view==='parent'||view==='review') ? 'scroll' : '';

  else if(view==='quiz') renderQuiz(app);

  else if(view==='parent') renderParent(app);
  else if(view==='review') renderReview(app);

}

/* ----- ホーム ----- */

    h+='<button class="opt" data-mode="'+m+'" aria-pressed="'+(s.mode===m)+'"><span class="num">'+NUM[m]+'</span><span>'+MODES[m].title+'<span class="sub">'+MODES[m].desc+'</span></span></button>';
  });
  h+='</div><div class="row"><span class="lab">もんだい</span>'+
    '<button class="opt" data-scope="all" aria-pressed="'+(s.scope==='all')+'">ぜんぶ</button>'+
    '<button class="opt" data-scope="review" aria-pressed="'+(s.scope==='review')+'">ふくしゅう</button></div>'+

function startSession(set, mode, kind, qids){
  if(!qids.length){ toast('ふくしゅうする もんだいは ありません'); return; }
  var s=st.settings;
  var begin=function(){
    st.current={id:uid(), setId:set.id, mode:mode, kind:kind, order:s.order,
      method: MODES[mode].write ? s.method : 'mind',
      sub: mode===5 ? Core.assignSub(qids) : null,  /* ⑤は復習でも毎回①〜④を問題ごとにランダム */
      qids: s.order==='random' ? Core.shuffle(qids) : Core.sortBySet(qids,set),
      pos:0, phase:'question', answers:{}, draft:null, startedAt:Date.now()};
    Store.save(); go('quiz');
  };
  if(st.current){
    confirmDialog('とちゅうの れんしゅうが あります。それを やめて、あたらしく はじめますか？','あたらしく はじめる','もどる')
      .then(function(ok){ if(ok) begin(); });
  } else begin();
}

/* ----- 問題・答え ----- */
function renderQuiz(app){
  var cur=st.current; if(!cur){ go('home'); return; }
  var set=getSet(cur.setId); if(!set){ st.current=null; Store.save(); go('home'); return; }
  var q=qmap(set)[cur.qids[cur.pos]];
  var head='<header class="qbar noselect"><button class="btn ghost small" id="quit">やめる</button>'+
    '<div class="qinfo"><span class="count">'+(cur.pos+1)+'／'+cur.qids.length+'</span>'+
    '<span class="chip">'+NUM[cur.mode]+' '+MODES[cur.mode].title+'</span>'+
    (cur.mode===5 ? '<span class="chip" style="background:var(--sun-soft)">'+NUM[Core.modeOf(cur,q.id)]+' '+MODES[Core.modeOf(cur,q.id)].title+'</span>' : '')+
    (cur.kind!=='all'?'<span class="chip rev">ふくしゅう</span>':'')+'</div><span></span>'+
    '<div class="pbar"><i style="width:'+Math.round(cur.pos/cur.qids.length*100)+'%"></i></div></header>';
  if(cur.phase==='question') renderQuestion(app, head, cur, q); else renderAnswer(app, head, cur, q, set);
  $('#quit').onclick=function(){ Store.save(); go('home'); toast('「つづきから」で また はじめられるよ'); };
}

  var cls = m===1 ? 'yomi fitlen' : m===4 ? 'imi' : 'kanji fitlen';

    '<section class="prompt"><div class="label">'+label+'</div><div class="ptext '+cls+'" style="--len:'+lenOf(text)+'">'+esc(text)+'</div></section><section class="work">';

  }
  h+='</section></main><footer class="qfoot noselect"><button class="btn primary xl" id="answer">こたえ</button></footer>';

    var draft = cur.draft && cur.draft.qid===q.id ? cur.draft.strokes : [];

    }});
    var setTool=function(t){ pad.mode=t; $('#tPen').setAttribute('aria-pressed',t==='pen'); $('#tErase').setAttribute('aria-pressed',t==='erase'); $('#pad').classList.toggle('erasing',t==='erase'); };

    else if(rs==='done') h+= a.pending.result==='ok'
      ? '<div class="recog ok noselect" data-lp="1"><span class="vd" style="font-size:24px">○ せいかい！</span></div>'
      : '<div class="recog ng noselect" data-lp="1"><span>よみとった字</span><span class="rt">'+esc(a.recognized)+'</span><span class="vd">△ ちがったよ</span><small>よみとりが まちがっていたら、おうちの人が あとで なおせます</small></div>';
    else if(rs==='error') h+='<div class="recog err">よみとれなかったので、こたえを見て たしかめよう</div>';
    else if(rs==='unsupported') h+='<div class="recog err">この ことばは じどうで さいてんできないので、こたえを見て たしかめよう</div>';
    else if(a.method==='screen' && a.drawn) h+='<div class="note">じぶんの字と こたえを くらべて えらぼう</div>';
    else if(a.method==='paper') h+='<div class="note">かみに かいた こたえと くらべよう</div>';
    else h+='<div class="note">かいていないので、こたえを見て たしかめよう</div>';
    h+='</section>';
  }
  h+='</div><section class="practice"><div class="phead noselect"><span class="label">れんしゅう（さいてんに はいらないよ）</span></div>'+
    '<div class="tools noselect"><button class="opt" id="pPen" aria-pressed="'+(practice.tool==='pen')+'">えんぴつ</button>'+
    '<button class="opt" id="pErase" aria-pressed="'+(practice.tool==='erase')+'">けしゴム</button>'+
    '<button class="opt" id="pUndo">1つ もどす</button><button class="opt" id="pClear">ぜんぶ けす</button>'+
    '<button class="opt" id="pGuide" aria-pressed="'+practice.guide+'">おてほん</button></div>'+
    '<div class="padwrap" id="practwrap"><canvas class="pad" id="pract" aria-label="れんしゅうらん"></canvas></div></section></main>';
  var last = cur.pos===cur.qids.length-1;
  h+='<footer class="afoot noselect"><div class="judge">';
  if(autoMode){
    h+= rs==='pending' ? '<div class="jrow"><span class="jl">よみとり中…</span></div>'
      : '<div class="jrow"><span class="pill lp'+(a.pending.result==='ok'?'':' warn')+'" data-lp="1" style="font-size:22px;padding:10px 20px">'+(a.pending.result==='ok'?'○ せいかい':'△ もういちど')+'</span></div>';
  } else {
    var rows = m===3 ? [['yomi','よみ'],['imi','いみ']] : [['result','']];
    rows.forEach(function(r){
      var v=a.pending[r[0]];
      h+='<div class="jrow">'+(r[1]?'<span class="jl">'+r[1]+'</span>':'')+
        '<button class="jbtn ok" data-f="'+r[0]+'" data-v="ok" aria-pressed="'+(v==='ok')+'"><span class="mk">○</span>できた</button>'+
        '<button class="jbtn ng" data-f="'+r[0]+'" data-v="ng" aria-pressed="'+(v==='ng')+'"><span class="mk">△</span>もういちど</button></div>';
    });
  }
  h+='</div><button class="btn primary xl" id="next" '+(Core.isComplete(m,a.pending)?'':'disabled')+'>'+(last?'けっかを見る':'つぎへ')+'</button></footer>';
  app.innerHTML=h;
  if($('#mine')){ var g=geoOf(a); minePad=mountPad($('#mine'), $('#minewrap'), {readOnly:true, strokes:a.strokes, lh:g.h, cell:g.cell}); }
  if($('#pract')){
    pad=mountPad($('#pract'), $('#practwrap'), {strokes:practice.strokes, finger:st.settings.finger, guide:Array.from(q.kanji), showGuide:practice.guide,
      onChange:function(x){ practice.strokes=x.map(function(z){return z.slice();}); }});
    pad.mode=practice.tool; $('#pract').classList.toggle('erasing', practice.tool==='erase');
    if(document.fonts && document.fonts.load){ var pp=pad; document.fonts.load('600 100px "Klee One"', q.kanji).then(function(){ pp.redraw(); }, function(){}); }
    var setT=function(t){ practice.tool=t; pad.mode=t; $('#pPen').setAttribute('aria-pressed',t==='pen'); $('#pErase').setAttribute('aria-pressed',t==='erase'); $('#pract').classList.toggle('erasing',t==='erase'); };
    $('#pPen').onclick=function(){ setT('pen'); };
    $('#pErase').onclick=function(){ setT('erase'); };
    $('#pUndo').onclick=function(){ pad.undo(); };
    $('#pClear').onclick=function(){ pad.clear(); };
    $('#pGuide').onclick=function(){ practice.guide=!practice.guide; pad.o.showGuide=practice.guide; this.setAttribute('aria-pressed',practice.guide); pad.redraw(); };
  }

  if(rs==='pending') runRecognition(cur, q, a);
  /* 自動採点の結果を長押し（0.6秒）で ○⇔△ に切り替える（その場での修正） */
  if(rs==='done') $$('[data-lp]').forEach(function(el){
    var t=null, pos0=cur.pos;
    var cancel=function(){ if(t){ clearTimeout(t); t=null; el.classList.remove('pressing'); } };
    el.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    el.addEventListener('pointerdown',function(e){
      e.preventDefault(); cancel(); el.classList.add('pressing');
      t=setTimeout(function(){
        t=null; el.classList.remove('pressing');
        if(cur.phase!=='answer' || cur.pos!==pos0) return;
        a.pending={result: a.pending.result==='ok' ? 'ng' : 'ok'}; Store.save(true); render();
        toast('はんていを '+(a.pending.result==='ok'?'○':'△')+' に かえました');
      },600);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ el.addEventListener(ev,cancel); });
  });
  $$('.jbtn').forEach(function(b){ b.onclick=function(){
    a.pending[b.dataset.f]=b.dataset.v; Store.save(true);
    $$('.jbtn[data-f="'+b.dataset.f+'"]').forEach(function(x){ x.setAttribute('aria-pressed', x===b); });
    $('#next').disabled=!Core.isComplete(m,a.pending);
    if(b.dataset.v==='ok') chime('ok');
  }; });
  var pos=cur.pos;
  $('#next').onclick=function(){
    if(busy || !st.current || cur.phase!=='answer' || cur.pos!==pos || !Core.isComplete(m,a.pending) || a.recogState==='pending') return;
    busy=true; this.disabled=true;
    a.final=Object.assign({},a.pending); a.judgedBy = a.recogState==='done' ? (a.final.result!==a.auto ? 'onsite' : 'auto') : 'self'; a.decidedAt=Date.now();
    Core.applyReview(st.review, cur.setId, q.id, m, a.final, a.decidedAt);
    cur.pos++;
    if(cur.pos>=cur.qids.length) finishSession(); else { cur.phase='question'; Store.save(); render(); }
  };
}

function finishSession(){
  var cur=st.current, sum=Core.summarize(cur);
  var set=getSet(cur.setId); sum.setName=set?setLabel(set):'';
  st.results.unshift(sum); if(st.results.length>300) st.results.length=300;
  var ans={};
  Object.keys(cur.answers).forEach(function(k){
    var a=cur.answers[k];
    ans[k]={pad:a.pad||null, ranks:a.ranks||null, strict:a.strict||null, kanaFree:!!a.kanaFree, mode:a.mode||Core.modeOf(cur,k), method:a.method, drawn:a.drawn, recognized:a.recognized||null, candidates:a.candidates||null,
      auto:a.auto||null, recogState:a.recogState||'none', final:a.final, judgedBy:a.judgedBy, decidedAt:a.decidedAt,
      strokes: a.drawn ? a.strokes.map(function(s){ return s.map(function(p){ return [p[0],p[1]]; }); }) : undefined};
  });
  st.logs=st.logs||[];
  st.logs.unshift({id:cur.id, setId:cur.setId, setName:sum.setName, mode:cur.mode, kind:cur.kind, order:cur.order, sub:cur.sub||null,
    qids:cur.qids.slice(), answers:ans, startedAt:cur.startedAt, endedAt:sum.endedAt, hasStrokes:true});
  if(st.logs.length>LOG_MAX) st.logs.length=LOG_MAX;
  st.logs.forEach(function(l,i){ if(i>=LOG_STROKES && l.hasStrokes) stripStrokes(l); });
  st.lastResultId=sum.id; st.current=null; Store.save(); chime('end'); go('result');
}

  h+='</section><section class="panel" style="--h:var(--pink)"><h2>もういちど れんしゅうする もんだい（'+r.wrongIds.length+'）</h2><div class="wlist">';

  h+='</div></section></main><footer class="rfoot">'+

    '<button class="btn" id="again">もういちど ぜんぶ</button><button class="btn" id="home">ホームへ</button></footer>';

  $('#again').onclick=function(){ if(!set) return; useSettings(); st.settings.scope='all'; startSession(set, r.mode, 'all', set.questions.map(function(q){return q.id;})); };

  h+='<div class="tablewrap"><table class="hist"><thead><tr><th>日時</th><th>問題集</th><th>モード</th><th>得点</th><th>自動採点</th><th></th></tr></thead><tbody>';
  logs.forEach(function(l){
    var r=logResult(l); if(!r) return;
    h+='<tr><td>'+fmtDate(l.endedAt)+'</td><td>'+esc(l.setName||'')+'</td><td>'+NUM[l.mode]+(l.kind!=='all'?' 復習':'')+'</td>'+
      '<td>'+r.percent+'点（'+r.correct+'／'+r.total+'）</td>'+
      '<td>'+(r.autoN?r.autoN+'問'+(r.fixedN?'・修正'+r.fixedN:''):'—')+'</td>'+
      '<td><button class="btn small" data-review="'+esc(l.id)+'">答案を見る</button></td></tr>';
  });
  return h+'</tbody></table></div></section>';
}
function promptOf(m,q){ return m===1 ? q.yomi : m===4 ? q.imi : q.kanji; }
function renderReview(app){
  var log=(st.logs||[]).filter(function(l){ return l.id===reviewId; })[0];
  if(!log){ go('parent'); return; }
  var set=getSet(log.setId), qm=set?qmap(set):{}, r=logResult(log);
  var keep=app.scrollTop;
  var h='<header class="topbar"><div class="brand"><i>字</i>答案のふりかえり</div><button class="btn primary" id="back">もどる</button></header><div class="parent">'+
    '<section class="panel"><div class="row" style="justify-content:space-between"><span><b>'+esc(log.setName||'')+'</b>　'+NUM[log.mode]+' '+MODES[log.mode].title+(log.kind!=='all'?'（復習）':'')+'　'+fmtDate(log.endedAt)+'</span>'+
    (r?'<span class="pill" style="font-size:20px">'+r.percent+'点（'+r.correct+'／'+r.total+'）</span>':'')+'</div>'+
    (set?'':'<div class="msg warn">この問題集は削除されているため、問題文を表示できません。</div>')+
    '<p class="credit">○／△ を押すと、その場で判定が直り、得点と復習の対象に反映されます。</p></section><div class="rlist">';
  log.qids.forEach(function(qid,i){
    var a=log.answers[qid]||{}, q=qm[qid]||{kanji:'?',yomi:'?',imi:'?'}, m=a.mode||Core.modeOf(log,qid), f=a.final||{};
    var how = a.correctedBy ? '<span class="tag" style="background:var(--sun-soft)">おうちの人が修正</span>'
      : a.judgedBy==='onsite' ? '<span class="tag" style="background:var(--sun-soft)">その場で修正（自動は'+(a.auto==='ok'?'○':'△')+'）</span>'
      : a.judgedBy==='auto' ? '<span class="tag" style="background:var(--sky-soft)">自動</span>' : '<span class="tag" style="background:var(--mint-soft)">自己採点</span>';
    var ok=Core.isCorrect(m,f);
    h+='<article class="ritem'+(ok?'':' wrong')+'"><div class="rno">'+(i+1)+'</div><div class="rbody">'+
      '<div class="rhead"><span class="chip">'+NUM[m]+' '+MODES[m].title+'</span>'+how+'</div>'+
      '<div class="rq"><span class="label">問題</span> <span class="rp">'+esc(promptOf(m,q))+'</span></div>'+
      '<div class="rq"><span class="label">正解</span> <span class="rk">'+esc(q.kanji)+'</span> '+esc(q.yomi)+'<br><span class="credit">'+esc(q.imi)+'</span></div>'+
      '</div><div class="rans">';
    if(a.strokes && a.strokes.length) h+='<canvas class="pad thumb" data-thumb="'+esc(qid)+'"></canvas>';
    else if(a.method==='paper') h+='<div class="empty">紙に書いた</div>';
    else if(a.method==='mind') h+='<div class="empty">口頭・頭の中で答えた</div>';
    else if(a.drawn) h+='<div class="empty">筆跡は保存期間外</div>';
    else h+='<div class="empty">書いていない</div>';
    if(a.recognized) h+='<div class="rrec">読み取り：<b>'+esc(a.recognized)+'</b></div>';
    if(a.recognized && a.strict) h+='<div class="credit">'+STRICT_LABEL[a.strict]+'で判定'+
      (a.ranks ? '・正解の字の順位：'+a.ranks.map(function(x){ return x==='kana'?'かな（字数のみ）':x<0?'候補外':(x+1)+'位'; }).join('／') : '・字数ちがい')+'</div>';
    else if(a.recogState==='error') h+='<div class="rrec">読み取り：できなかった</div>';
    else if(a.recogState==='unsupported') h+='<div class="rrec">読み取り：対応外の字</div>';
    h+='</div><div class="rjudge">';
    (m===3 ? [['yomi','読み'],['imi','意味']] : [['result','']]).forEach(function(rw){
      var v=f[rw[0]];
      h+='<div class="jrow">'+(rw[1]?'<span class="jl">'+rw[1]+'</span>':'')+
        '<button class="jbtn ok sm" data-q="'+esc(qid)+'" data-f="'+rw[0]+'" data-v="ok" aria-pressed="'+(v==='ok')+'"><span class="mk">○</span></button>'+
        '<button class="jbtn ng sm" data-q="'+esc(qid)+'" data-f="'+rw[0]+'" data-v="ng" aria-pressed="'+(v==='ng')+'"><span class="mk">△</span></button></div>';
    });
    h+='</div></article>';
  });
  h+='</div></div>';
  app.innerHTML=h; app.scrollTop=keep;
  $('#back').onclick=function(){ go('parent'); };
  $$('canvas[data-thumb]').forEach(function(c){
    var la=log.answers[c.dataset.thumb], g=geoOf(la); var tp=new Pad(c,{readOnly:true, strokes:la.strokes, lh:g.h, cell:g.cell, ink:{style:'pencil', width:1, sens:2}}); tp.fit(240,180);
  });
  $$('.rjudge .jbtn').forEach(function(b){ b.onclick=function(){ correctAnswer(log, b.dataset.q, b.dataset.f, b.dataset.v); }; });
}
function correctAnswer(log, qid, field, val){
  var a=log.answers[qid]; if(!a || !a.final || a.final[field]===val) return;
  var m=a.mode||Core.modeOf(log,qid);
  a.final=Object.assign({}, a.final); a.final[field]=val;
  a.correctedBy='parent'; a.correctedAt=Date.now();
  Core.reviseReview(st.review, log.setId, qid, m, a.decidedAt, a.final);
  var old=logResult(log);
  var sum=Core.summarize({id:log.id, setId:log.setId, mode:log.mode, kind:log.kind, order:log.order, sub:log.sub, qids:log.qids, answers:log.answers, startedAt:log.startedAt});
  if(old){ sum.setName=old.setName; sum.endedAt=old.endedAt; st.results[st.results.indexOf(old)]=sum; }
  Store.save(); render(); toast('判定を直しました（'+sum.percent+'点）');
}

function analyzeImp(){
  var d=Core.decode(imp.buf, imp.enc); imp.decoded=d;
  imp.a=Core.analyze(d.text, {header:imp.header});
  if(Recog.state!=='ready') Recog.load().then(function(){ if(view==='parent' && imp) render(); }, function(){});
}
function previewHTML(){
  var a=imp.a, d=imp.decoded;
  var blocked = !!a.error || !a.valid.length || (a.missing.length && !imp.exclude) || !imp.name.trim();
  var h='<div class="msgs" style="margin-top:8px">';
  h+='<div class="msg info"><b>'+esc(imp.fileName)+'</b>　文字コード：'+(d.encoding==='utf-8'?'UTF-8'+(d.bom?'（BOMあり）':''):'Shift_JIS')+(d.guessed?'（自動判定）':'')+
    '　／　登録できる問題：<b>'+a.valid.length+'問</b>'+(a.missing.length?'　／　欠けている行：'+a.missing.length+'行':'')+
    '<br>文字化けしている場合は、上の「文字コード」を切り替えてください。</div>';
  if(a.error) h+='<div class="msg err"><b>CSVの形式に誤りがあります（'+a.error.line+'行目付近）</b>：'+esc(a.error.message)+'。修正したCSVを選び直してください。このファイルは取り込めません。</div>';
  if(a.missing.length){
    h+='<div class="msg err"><b>漢字・読み・意味のどれかが空の行があります</b><ul>';
    a.missing.slice(0,20).forEach(function(r){ h+='<li>'+r.line+'行目：'+r.lack.join('・')+'が空（'+esc([r.kanji,r.yomi,r.imi].filter(Boolean).join(' / ')||'—')+'）</li>'; });
    if(a.missing.length>20) h+='<li>ほか '+(a.missing.length-20)+'行</li>';
    h+='</ul><label class="check"><input type="checkbox" id="exclude" '+(imp.exclude?'checked':'')+'>これらの行を除いて取り込む</label></div>';
  }
  if(!a.valid.length && !a.error) h+='<div class="msg err">正しい問題が0問のため、取り込めません。</div>';
  if(a.extraCols) h+='<div class="msg warn">D列以降にもデータがあります。D列以降は読み込みません。</div>';
  if(a.dups.length){
    h+='<div class="msg warn"><b>まったく同じ内容の行があります</b>（削除はしていません。別の問題として出題します）<ul>';
    a.dups.slice(0,10).forEach(function(x){ h+='<li>'+x.line+'行目「'+esc(x.kanji)+'」は '+x.first+'行目と同じ</li>'; });
    h+='</ul></div>';
  }
  if(Recog.chars){
    var bad=[]; a.valid.forEach(function(q){ var u=Recog.unsupported(q.kanji); if(u.length) bad.push(q.line+'行目「'+esc(q.kanji)+'」（'+u.map(esc).join('・')+'）'); });
    if(bad.length){
      h+='<div class="msg warn"><b>自動採点できない字を含む行があります</b>。これらは①④で自己採点になります（小さい「ゃ・っ」やカタカナ、一部の漢字は読み取れません）。<ul>';
      bad.slice(0,15).forEach(function(x){ h+='<li>'+x+'</li>'; }); if(bad.length>15) h+='<li>ほか '+(bad.length-15)+'行</li>';
      h+='</ul></div>';
    }
  }
  var longs=a.valid.filter(function(q){ return Array.from(q.kanji).length>6; });
  if(longs.length){
    h+='<div class="msg warn"><b>漢字の列が7文字以上の行があります</b>。書き取り欄は6マスなので、①④では書ききれません。<ul>';
    longs.slice(0,10).forEach(function(q){ h+='<li>'+q.line+'行目「'+esc(q.kanji)+'」</li>'; }); h+='</ul></div>';
  }
  if(a.homophones.length){
    h+='<div class="msg warn"><b>同じ読みで漢字がちがう行があります</b>。①（読み→漢字）では答えが1つに決まらないため、答え画面で別解を正解にしてください。<ul>';
    a.homophones.slice(0,10).forEach(function(x){ h+='<li>'+esc(x.yomi)+'：'+x.kanji.map(esc).join('、')+'</li>'; });
    h+='</ul></div>';
  }
  h+='</div><label class="check"><input type="checkbox" id="hdr" '+(a.useHeader?'checked':'')+'>1行目を見出し（漢字,読み,意味）として扱う'+(a.headerDetected?'（自動で見出しと判定）':'')+'</label>';
  h+='<div class="field"><label for="setname">問題集の名前</label><input type="text" id="setname" value="'+esc(imp.name)+'"></div>';
  if(a.valid.length){
    h+='<div class="tablewrap"><table><thead><tr><th>行</th><th>漢字</th><th>読み</th><th>意味</th></tr></thead><tbody>';
    a.valid.slice(0,200).forEach(function(q){ h+='<tr><td class="n">'+q.line+'</td><td class="k">'+esc(q.kanji)+'</td><td>'+esc(q.yomi)+'</td><td>'+esc(q.imi)+'</td></tr>'; });
    if(a.valid.length>200) h+='<tr><td colspan="4">ほか '+(a.valid.length-200)+'問</td></tr>';
    h+='</tbody></table></div>';
  }
  h+='<div class="row"><button class="btn primary" id="doImport" '+(blocked?'disabled':'')+'>この内容で取り込む（'+a.valid.length+'問）</button><button class="btn ghost" id="cancelImport">やめる</button></div>';
  return h;
}
function bindPreview(){
  if(!imp) return;
  if($('#exclude')) $('#exclude').onchange=function(){ imp.exclude=this.checked; render(); };
  $('#hdr').onchange=function(){ imp.header=this.checked; analyzeImp(); render(); };
  $('#setname').oninput=function(){ imp.name=this.value; $('#doImport').disabled = !!imp.a.error || !imp.a.valid.length || (imp.a.missing.length && !imp.exclude) || !this.value.trim(); };
  $('#cancelImport').onclick=function(){ imp=null; render(); };
  $('#doImport').onclick=function(){
    var a=imp.a; if(a.error || !a.valid.length || (a.missing.length && !imp.exclude)) return;
    var name=imp.name.trim();
    var ver=st.sets.filter(function(x){return x.name===name;}).reduce(function(m,x){return Math.max(m,x.version||1);},0)+1;
    var set={id:uid(), name:name, version:ver, importedAt:Date.now(), fileName:imp.fileName, encoding:imp.decoded.encoding,
      questions:a.valid.map(function(q,i){ return {id:'q'+(i+1), row:q.line, kanji:q.kanji, yomi:q.yomi, imi:q.imi}; })};
    st.sets.push(set); st.settings.setId=set.id;
    if(!Store.save()){ st.sets.pop(); return; }
    imp=null; render(); toast('「'+setLabel(set)+'」を取り込みました（'+set.questions.length+'問）');
  };
}

/* ===== 起動 ===== */
Store.load(); st=Store.state;
render();
if(st.settings.autoJudge) setTimeout(function(){ Recog.load().catch(function(){}); }, 400);
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
</script>
